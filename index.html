
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>EMT Field Pro</title>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#edf6ff;background:#071a2e;
  --panel:#102e4a;--edge:#315a78;
  --blue:#0877d9;--yellow:#ffd43b;
  --green:#79e9ae;--muted:#abc4d9
}
*{box-sizing:border-box}
body{margin:0;background:#071a2e}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.app{max-width:900px;margin:auto;padding:16px 12px 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
h1{font-size:clamp(25px,5vw,34px);margin:0;font-weight:800}
h1 span{color:var(--yellow)}
small,.muted{color:var(--muted)}
.tabs,.modes{display:grid;gap:6px;margin-bottom:12px}
.tabs{grid-template-columns:1fr 1fr}
.modes{grid-template-columns:repeat(4,1fr)}
button{border:1px solid #416b89;border-radius:9px;background:#193c59;color:#edf6ff;padding:12px 5px;font-weight:700}
button.active{background:var(--blue);border-color:#59b6ff}
.modes button.active{background:#173a58;border:2px solid var(--yellow);color:var(--yellow)}
.modes button{min-height:76px;font-size:12px}
.modes svg{display:block;width:75%;height:29px;margin:0 auto 5px}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:13px;overflow:hidden;margin-bottom:12px}
.panel h2{background:linear-gradient(110deg,#0c548f,#087bd6);padding:12px 14px;margin:0;font-size:17px}
.content{padding:12px}
.diagram{width:100%;display:block}
.diagram text{font-family:Arial,sans-serif}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #34536c;min-height:60px}
.field:last-child{border:0}
.field label{font-size:14px;flex:1}
.entry{display:flex;align-items:center;gap:7px}
input{width:110px;max-width:33vw;background:#f0f6fd;border:2px solid #9ab6cd;border-radius:8px;color:#172d40;padding:10px;text-align:center;font-weight:750;font-size:20px}
input:focus{outline:3px solid var(--yellow)}
.units{font-size:13px;color:#d4e5f4}
.choices{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}
.choices button{padding:9px 10px;font-size:13px}
.results{padding:12px}
.result{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #34536c;font-size:14px}
.result strong{text-align:right;color:#fff}
.result.highlight{color:var(--yellow);font-weight:700}
.result.highlight strong{color:var(--yellow)}
.result:last-child{border:0}
.keyboard{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.keyboard button{font-size:20px;padding:12px 3px;min-height:51px;background:#244765}
.keyboard button.fraction{font-size:15px}
.keyboard button.special{background:#0877d9}
.keyboard button:active{background:#4896cf}
.help{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0}
.tip{color:#83c7ff;background:none;border:0;padding:3px;font-size:13px}
.error{color:#ffaeae;font-size:13px;padding-top:8px}
.fraction-result{text-align:center;font-size:32px;color:var(--green);font-weight:800;padding:12px}
[hidden]{display:none!important}
@media(max-width:440px){
  .app{padding:10px 8px}
  .modes{gap:4px}
  .modes button{font-size:11px;padding:8px 2px}
  .field label{font-size:13px}
  .choices button{padding:8px 7px}
  .content{padding:9px}
  .keyboard button{min-height:47px}
}
</style>
</head>
<body>
<div class="app">
<header>
<h1><span>EMT</span> Field Pro</h1>
<small>Klein Tools • Auto Calc</small>
</header>

<nav class="tabs">
<button id="tabFraction" onclick="switchTab('fraction')">Fraction Calc</button>
<button id="tabBending" class="active" onclick="switchTab('bending')">Conduit Bending</button>
</nav>

<section id="fractionPage" hidden>
<div class="panel">
<h2>Fraction Calculator</h2>
<div class="content">
<div class="field">
<label>First Measurement</label>
<div class="entry"><input id="fracA" readonly placeholder="0"><span class="units">in</span></div>
</div>
<div class="field">
<label>Operation</label>
<div class="choices" id="operations"></div>
</div>
<div class="field">
<label>Second Measurement</label>
<div class="entry"><input id="fracB" readonly placeholder="0"><span class="units">in</span></div>
</div>
<div class="fraction-result" id="fractionResult">0″</div>
<div class="error" id="fractionError"></div>
</div>
</div>
</section>

<section id="bendingPage">
<div class="modes" id="modeButtons"></div>
<div class="panel">
<h2 id="diagramTitle">Up Offset • 2 Bends</h2>
<div class="content">
<svg id="diagram" class="diagram" viewBox="0 0 760 380" role="img" aria-label="Conduit bending diagram"></svg>
</div>
</div>

<div class="panel">
<h2>Field Measurements</h2>
<div class="content">
<div class="field">
<label>EMT Size</label>
<div class="choices" id="sizes"></div>
</div>
<div id="measurementFields"></div>
<div class="field">
<label>Bend Angle</label>
<div class="choices" id="angles"></div>
</div>
<div id="fieldError" class="error"></div>
</div>
</div>

<div class="panel">
<h2>Calculated Results</h2>
<div id="bendResults" class="results"></div>
</div>
</section>

<div class="keyboard" id="keyboard"></div>
<p class="help">Measurements in inches • Rounded to nearest 1/8″ • Diagram not to scale</p>
</div>

<script>
"use strict";

const state={
 tab:"bending",
 mode:"offset",
 size:"1/2",
 angle:22.5,
 operation:"+",
 activeInput:null,
 fields:{
  offset:{height:"2",distance:"37"},
  three:{height:"2",distance:"24"},
  four:{height:"2",width:"8",distance:"24"},
  kick:{height:"2",distance:"24"}
 }
};

const modes=[
 ["offset","Up Offset","M0 23 L18 23 L45 5 L70 5"],
 ["three","3-Point","M0 25 L17 25 L35 5 L53 25 L70 25"],
 ["four","4-Point","M0 25 L14 25 L27 5 L45 5 L58 25 L70 25"],
 ["kick","Kick Up","M0 25 L22 25 L70 5"]
];

const definitions={
 offset:{
  title:"Up Offset • 2 Bends",
  inputs:[
   ["height","Offset Height (H)"],
   ["distance","START → Box (horizontal distance)"]
  ]
 },
 three:{
  title:"3-Point Saddle",
  inputs:[
   ["height","Obstacle Height (H)"],
   ["distance","START → Obstacle Center"]
  ]
 },
 four:{
  title:"4-Point Saddle",
  inputs:[
   ["height","Obstacle Height (H)"],
   ["width","Obstacle Width"],
   ["distance","START → Obstacle Center"]
  ]
 },
 kick:{
  title:"Kick Up",
  inputs:[
   ["height","Kick Height (H)"],
   ["distance","START → Kick Target"]
  ]
 }
};

function parseInches(value){
 const s=String(value).trim().replace(/″|"/g,"")
  .replace(/\s*\/\s*/g,"/");
 if(!s)return NaN;
 const m=s.match(/^(-)?(?:(\d+)\s+)?(\d+)\/(\d+)$/);
 if(m){
  const denominator=Number(m[4]);
  if(!denominator)return NaN;
  const n=Number(m[2]||0)+Number(m[3])/denominator;
  return m[1]?-n:n;
 }
 const n=Number(s);
 return Number.isFinite(n)?n:NaN;
}

function gcd(a,b){
 while(b){const t=b;b=a%b;a=t}
 return a||1;
}
function formatInches(value){
 if(!Number.isFinite(value))return "—";
 const negative=value<0?"−":"";
 const eighths=Math.round(Math.abs(value)*8);
 const whole=Math.floor(eighths/8);
 const remainder=eighths%8;
 if(!remainder)return negative+whole+'″';
 const divisor=gcd(remainder,8);
 const fraction=(remainder/divisor)+"/"+(8/divisor);
 return negative+(whole?whole+" ":"")+fraction+'″';
}
function fmt(value){return formatInches(value)}
function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}

function switchTab(tab){
 state.tab=tab;
 document.getElementById("fractionPage").hidden=tab!=="fraction";
 document.getElementById("bendingPage").hidden=tab!=="bending";
 document.getElementById("tabFraction").classList.toggle("active",tab==="fraction");
 document.getElementById("tabBending").classList.toggle("active",tab==="bending");
 state.activeInput=null;
}

function buildButtons(){
 document.getElementById("modeButtons").innerHTML=modes.map(([id,name,path])=>
 `<button class="${state.mode===id?"active":""}" onclick="setMode('${id}')">
 <svg viewBox="0 0 70 32"><path d="${path}" fill="none" stroke="#c7e5ff" stroke-width="4"/></svg>${name}</button>`
 ).join("");

 document.getElementById("sizes").innerHTML=
 ["1/2","3/4","1"].map(v=>
 `<button class="${state.size===v?"active":""}" onclick="setSize('${v}')">${v}″</button>`
 ).join("");

 document.getElementById("angles").innerHTML=
 [10,22.5,30,45,60].map(v=>
 `<button class="${state.angle===v?"active":""}" onclick="setAngle(${v})">${v}°</button>`
 ).join("");

 document.getElementById("operations").innerHTML=
 ["+","−","×","÷"].map(v=>
 `<button class="${state.operation===v?"active":""}" onclick="setOperation('${v}')">${v}</button>`
 ).join("");
}

function setMode(mode){
 state.mode=mode;
 state.activeInput=null;
 // Suggested angle; user can change it.
 state.angle=mode==="three"?22.5:mode==="four"?30:22.5;
 render();
}
function setSize(v){state.size=v;render()}
function setAngle(v){state.angle=v;render()}
function setOperation(v){state.operation=v;buildButtons();calculateFraction()}

function renderFields(){
 const def=definitions[state.mode];
 document.getElementById("diagramTitle").textContent=def.title;
 document.getElementById("measurementFields").innerHTML=
 def.inputs.map(([id,label])=>
 `<div class="field"><label for="f_${id}">${label}</label>
 <div class="entry"><input id="f_${id}" readonly
 data-field="${id}" value="${esc(state.fields[state.mode][id])}"
 onclick="selectInput(this)"><span class="units">in</span></div></div>`
 ).join("");
}

function selectInput(el){
 if(state.activeInput)state.activeInput.style.outline="";
 state.activeInput=el;
 el.style.outline="3px solid var(--yellow)";
}

function keyboardPress(key){
 let el=state.activeInput;
 if(!el || !document.body.contains(el) ||
  (state.tab==="fraction" && !["fracA","fracB"].includes(el.id)) ||
  (state.tab==="bending" && !el.dataset.field)){
  el=document.querySelector(state.tab==="fraction"?"#fracA":"#measurementFields input");
  if(!el)return;
  selectInput(el);
 }
 let value=el.value;
 if(key==="BACK")value=value.slice(0,-1);
 else if(key==="CLEAR")value="";
 else if(key==="SPACE")value+=" ";
 else if(key==="."){value+="."}
 else if(key.includes("/")){
  value+=key;
 }else value+=key;
 el.value=value;
 if(el.dataset.field)state.fields[state.mode][el.dataset.field]=value;
 if(state.tab==="fraction")calculateFraction();
 else calculateBending();
}

function buildKeyboard(){

const keys=[
  "SPACE",
  "1","2","3","BACK",
  "4","5","6","CLEAR",
  "7","8","9","0",
  ".","/"
];

 document.getElementById("keyboard").innerHTML=keys.map(key=>{
  const display=key==="BACK"?"⌫":key==="CLEAR"?"C":key;
  return `<button class="${key.includes("/")?"fraction":""} ${["SPACE","CLEAR"].includes(key)?"special":""}"
  onclick="keyboardPress('${key}')">${display}</button>`;
 }).join("");
}

function calculateFraction(){
 const a=parseInches(document.getElementById("fracA").value);
 const b=parseInches(document.getElementById("fracB").value);
 const error=document.getElementById("fractionError");
 error.textContent="";
 if(!Number.isFinite(a)||!Number.isFinite(b)){
  document.getElementById("fractionResult").textContent="—";
  return;
 }
 let result;
 switch(state.operation){
  case "+":result=a+b;break;
  case "−":result=a-b;break;
  case "×":result=a*b;break;
  case "÷":
   if(b===0){error.textContent="Cannot divide by zero.";return}
   result=a/b;break;
 }
 document.getElementById("fractionResult").textContent=fmt(result);
}

function sin(d){return Math.sin(d*Math.PI/180)}
function cos(d){return Math.cos(d*Math.PI/180)}
function tan(d){return Math.tan(d*Math.PI/180)}

function compute(){
 const v=state.fields[state.mode];
 const h=parseInches(v.height);
 const d=parseInches(v.distance);
 const w=state.mode==="four"?parseInches(v.width):0;
 const a=state.angle;
 if(!Number.isFinite(h)||h<=0)throw Error("Enter a valid positive height.");
 if(!Number.isFinite(d)||d<0)throw Error("Enter a valid distance.");
 if(state.mode==="four"&&(!Number.isFinite(w)||w<0))
  throw Error("Enter a valid obstacle width.");
 if(sin(a)<=0||tan(a)<=0)throw Error("Select a valid angle.");

 if(state.mode==="offset"){
  // d is finished horizontal START-to-box distance.
  // Straight conduit cut length is d + shrinkage.
  const spacing=h/sin(a);
  const horizontalRun=h/tan(a);
  const shrink=spacing-horizontalRun;
  // Position bends so the second bend ends at the box.
  const m1=d-horizontalRun;
  const m2=m1+spacing;
  if(m1<0)throw Error("The offset cannot fit before the box. Reduce height or increase distance.");
  return {h,d,w,a,spacing,shrink,m1,m2,
   cut:d+shrink,mode:"offset"};
 }

 if(state.mode==="three"){
  // Symmetric 3-point saddle, center bend 2*a.
  // Input center is measured horizontally from START.
  const sideAngle=a;
  if(sideAngle*2>=180)throw Error("Side angle too large.");
  const run=h/tan(sideAngle);
  const spacing=h/sin(sideAngle);
  const m2=d+spacing-run;
  const m1=m2-spacing;
  const m3=m2+spacing;
  const shrink=2*(spacing-run);
  if(m1<0)throw Error("Not enough distance before obstacle. Reduce height or angle.");
  return {h,d,w,a,spacing,shrink,m1,m2,m3,mode:"three"};
 }

 if(state.mode==="four"){
  // Four bends, symmetrical rise and descent.
  // Width is horizontal top clearance, not obstacle width
  // plus any bend clearance allowance.
  const run=h/tan(a);
  const spacing=h/sin(a);
  const left=d-w/2;
  const right=d+w/2;
  const m1=left-run;
  const m2=m1+spacing;
  const m3=m2+w;
  const m4=m3+spacing;
  const shrink=2*(spacing-run);
  if(m1<0)throw Error("Not enough approach distance for this saddle.");
  return {h,d,w,a,spacing,shrink,m1,m2,m3,m4,mode:"four"};
 }

 // Kick: single bend, height at target is h.
 // Distance is horizontal START-to-target.
 const kickRun=h/tan(a);
 const kickLength=h/sin(a);
 const m1=d-kickRun;
 if(m1<0)throw Error("Kick height is too large for the available distance.");
 return {h,d,w,a,m1,kickRun,kickLength,mode:"kick"};
}

function row(label,value,highlight=false){
 return `<div class="result ${highlight?"highlight":""}">
 <span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
}

function calculateBending(){
 const errors=document.getElementById("fieldError");
 const results=document.getElementById("bendResults");
 errors.textContent="";
 try{
  const c=compute();
  let html="";
  if(c.mode==="offset"){
   html+=row("M1 from START",fmt(c.m1));
   html+=row("M2 from START",fmt(c.m2));
   html+=row("M1–M2 • Bend spacing",fmt(c.spacing));
   html+=row("Shrinkage",fmt(c.shrink));
   html+=row("Required straight pipe length",fmt(c.cut),true);
   html+=row("Horizontal START → Box",fmt(c.d));
  }else if(c.mode==="three"){
   html+=row("M1 from START",fmt(c.m1));
   html+=row("M2 from START",fmt(c.m2));
   html+=row("M3 from START",fmt(c.m3));
   html+=row("Bend spacing",fmt(c.spacing));
   html+=row("Shrinkage",fmt(c.shrink),true);
   html+=row("Bend angles",`${c.a}° / ${2*c.a}° / ${c.a}°`);
  }else if(c.mode==="four"){
   ["m1","m2","m3","m4"].forEach(k=>
    html+=row(k.toUpperCase()+" from START",fmt(c[k])));
   html+=row("Slope bend spacing",fmt(c.spacing));
   html+=row("Top straight spacing",fmt(c.w));
   html+=row("Shrinkage",fmt(c.shrink),true);
  }else{
   html+=row("M1 from START",fmt(c.m1));
   html+=row("Kick angled length",fmt(c.kickLength));
   html+=row("Kick horizontal run",fmt(c.kickRun),true);
  }
  html+=row("Height (H)",fmt(c.h));
  html+=row("Angle",c.a+"°");
  results.innerHTML=html;
  drawDiagram(c);
 }catch(e){
  errors.textContent=e.message;
  results.innerHTML="";
  drawEmpty();
 }
}

function svgText(x,y,text,color="#eaf5ff",size=16,anchor="middle"){
 return `<text x="${x}" y="${y}" fill="${color}" font-size="${size}" text-anchor="${anchor}">${esc(text)}</text>`;
}
function line(x1,y1,x2,y2,color="#ffd43b",width=2,dash=""){
 return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
 stroke="${color}" stroke-width="${width}" ${dash?`stroke-dasharray="${dash}"`:""}/>`;
}
function dimension(x1,y1,x2,y2,label,yLabel){
 let s=line(x1,y1,x2,y2);
 s+=line(x1,y1-7,x1,y1+7);
 s+=line(x2,y2-7,x2,y2+7);
 s+=svgText((x1+x2)/2,yLabel,label,"#ffd43b",15);
 return s;
}
function marker(x,y,name){
 return `<circle cx="${x}" cy="${y}" r="7" fill="#ffd43b"/>`+
 svgText(x,y-15,name,"#ffd43b",16);
}
function drawEmpty(){
 document.getElementById("diagram").innerHTML=
 svgText(380,170,"Enter valid field measurements");
}

function drawDiagram(c){
 const yellow="#ffd43b",green="#79e9ae";
 let s=svgText(20,22,"SIDE VIEW • NOT TO SCALE","#abc4d9",14,"start");

 if(c.mode==="offset"){
  // The upper conduit ends at the right-side box.
  const x0=45,x1=315,x2=470,x3=670;
  const low=225,high=105;
  s+=`<path d="M${x0} ${low} H${x1} L${x2} ${high} H${x3}"
   fill="none" stroke="#43a9ff" stroke-width="9" stroke-linejoin="round"/>`;
  s+=`<rect x="670" y="62" width="67" height="88" rx="5"
   fill="#71879b" stroke="#d3e4f3" stroke-width="3"/>
   <circle cx="703" cy="105" r="13" fill="none" stroke="#b9cad8" stroke-width="2"/>`;
  s+=marker(x1,low,"M1")+marker(x2,high,"M2");
  s+=svgText(x1+35,low-18,c.a+"°",green,16);
  s+=svgText(x2+37,high+35,c.a+"°",green,16);
  s+=line(x0,low+9,x0,315,yellow,1.5,"5 5");
  s+=line(x3,high+5,x3,315,yellow,1.5,"5 5");
  s+=dimension(x0,315,x3,315,
    "START → BOX: "+fmt(c.d),306);
  s+=dimension(x1,65,x2,65,
    "M1–M2: "+fmt(c.spacing),53);
  s+=line(600,low,735,low,"#ff6969",1.5,"5 5");
  s+=line(600,high,735,high,"#ff6969",1.5,"5 5");
  s+=line(722,high,722,low,"#ff6969",3);
  s+=svgText(704,166,"H",yellow,17);
  s+=svgText(704,185,fmt(c.h),yellow,16);
  s+=svgText(x0,248,"START 0″",green,15,"start");
  s+=svgText(675,164,"BOX",green,15);
  s+=svgText(380,350,
    "CUT LENGTH: "+fmt(c.cut)+"   •   SHRINKAGE: "+fmt(c.shrink),
    green,17);
 }else if(c.mode==="three"){
  const pts=[[45,225],[245,225],[380,100],[515,225],[715,225]];
  s+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}"
   fill="none" stroke="#43a9ff" stroke-width="9"/>`;
  [[245,225,"M1"],[380,100,"M2"],[515,225,"M3"]]
   .forEach(p=>s+=marker(...p));
  s+=dimension(245,65,380,65,fmt(c.spacing),52);
  s+=dimension(380,65,515,65,fmt(c.spacing),52);
  s+=svgText(245,260,c.a+"°",green);
  s+=svgText(380,80,2*c.a+"°",green);
  s+=svgText(515,260,c.a+"°",green);
  s+=line(45,300,380,300,yellow);
  s+=svgText(210,289,"START → CENTER: "+fmt(c.d),yellow,15);
  s+=svgText(380,350,"SHRINKAGE: "+fmt(c.shrink),green,17);
  s+=svgText(45,245,"START",green,14,"start");
 }else if(c.mode==="four"){
  const pts=[[40,230],[195,230],[305,100],[455,100],[565,230],[720,230]];
  s+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}"
   fill="none" stroke="#43a9ff" stroke-width="9"/>`;
  [[195,230,"M1"],[305,100,"M2"],[455,100,"M3"],[565,230,"M4"]]
   .forEach(p=>s+=marker(...p));
  s+=dimension(305,65,455,65,"TOP: "+fmt(c.w),53);
  s+=dimension(195,285,565,285,
    "SLOPE SPACING: "+fmt(c.spacing),273);
  s+=svgText(380,335,"SHRINKAGE: "+fmt(c.shrink),green,17);
  s+=svgText(40,253,"START",green,14,"start");
  s+=svgText(380,365,"H: "+fmt(c.h)+"   •   "+c.a+"° EACH",yellow,15);
 }else{
  s+=`<path d="M45 230 H305 L675 85" fill="none"
   stroke="#43a9ff" stroke-width="9"/>`;
  s+=marker(305,230,"M1");
  s+=svgText(355,217,c.a+"°",green);
  s+=line(675,85,725,85,"#ff6969",2,"5 5");
  s+=line(675,230,725,230,"#ff6969",2,"5 5");
  s+=line(715,85,715,230,"#ff6969",3);
  s+=svgText(690,158,"H",yellow);
  s+=svgText(690,177,fmt(c.h),yellow);
  s+=dimension(45,300,675,300,
   "START → TARGET: "+fmt(c.d),288);
  s+=svgText(45,253,"START",green,15,"start");
  s+=svgText(380,345,"KICK LENGTH: "+fmt(c.kickLength),green,17);
 }
 document.getElementById("diagram").innerHTML=s;
}

function render(){
 buildButtons();
 renderFields();
 calculateBending();
 calculateFraction();
}

buildKeyboard();
render();
</script>
