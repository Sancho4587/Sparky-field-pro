
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061525">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>EMT Field Pro</title>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:#eef6ff;background:#061525;
  --blue:#0877df;--yellow:#ffd039;--green:#64dca0;
  --muted:#a9bfd4;
}
*{box-sizing:border-box}
body{margin:0;background:#061525}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.app{
  max-width:650px;margin:auto;
  padding:calc(env(safe-area-inset-top) + 12px) 12px
          calc(env(safe-area-inset-bottom) + 18px);
}
header{
  display:flex;justify-content:space-between;
  align-items:center;padding:7px 5px 16px;
}
.brand{font-size:clamp(25px,6vw,34px);font-weight:850;letter-spacing:-1px}
.brand span{color:var(--yellow)}
.version{font-size:11px;color:var(--muted)}
.tabs{
  display:grid;grid-template-columns:1fr 1fr;
  gap:3px;background:#0a365e;padding:3px;border-radius:10px;
}
.tabs button{
  border:0;border-radius:8px;background:transparent;
  color:#c8dcf0;padding:13px 5px;font-size:14px;font-weight:700;
}
.tabs button.active{background:var(--blue);color:white}
.modes{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;margin:13px 0;
}
.mode{
  background:#0a233d;border:1px solid #294764;
  border-radius:9px;color:white;min-height:93px;
  padding:8px 3px;font-size:11px;font-weight:700;
}
.mode.active{border:2px solid var(--yellow);color:var(--yellow)}
.mode svg{width:100%;height:40px;display:block;margin-bottom:6px}
.panel{
  border:1px solid #174b78;background:#08233e;
  border-radius:13px;overflow:hidden;margin:12px 0;
}
.panel-title{
  background:linear-gradient(110deg,#07518e,#0869b8);
  font-size:19px;font-weight:800;padding:11px 13px;
}
.panel-title small{
  float:right;font-size:11px;font-weight:400;margin-top:6px;
}
.diagram-wrap{padding:10px 8px 5px}
.diagram{width:100%;display:block}
.diagram text{font-family:Arial,sans-serif}
.section{padding:12px}
.field{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;border-bottom:1px solid #294764;padding:10px 0;
}
.field:last-child{border-bottom:0}
.field label{font-size:14px;flex:1}
.measure{
  width:102px;min-height:43px;border:1px solid #6a829c;
  border-radius:7px;background:#edf4ff;color:#14243a;
  font-weight:700;font-size:19px;padding:8px;
  text-align:center;outline:none;
}
.measure.selected{border:3px solid var(--yellow)}
.unit{font-size:13px}
.choices{
  display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;
}
.choice{
  border:1px solid #45617d;background:#193b59;
  color:#edf5ff;padding:9px 10px;border-radius:7px;
  font-weight:700;font-size:13px;
}
.choice.active{background:var(--blue);border-color:#50a9ff}
.result-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;border-bottom:1px solid #294764;padding:10px 0;
}
.result-row:last-child{border-bottom:0}
.result-row span{font-size:14px}
.result-row strong{
  color:#0a2035;background:#ffd75a;padding:9px 11px;
  border-radius:7px;text-align:center;min-width:90px;font-size:16px;
}
.result-row strong.green{background:#91e4ac}
.hint{
  font-size:12px;color:var(--muted);
  line-height:1.5;margin:10px 0;
}
.hidden{display:none!important}
.calc-display{
  background:#e9f2ff;color:#10263b;
  padding:12px;border-radius:9px;margin-top:9px;
}
.calc-display input{
  width:100%;border:0;background:transparent;
  color:#10263b;font-size:24px;font-weight:700;outline:none;
}
.calc-display.selected{outline:3px solid var(--yellow)}
.calc-result{
  padding:13px 0;font-size:29px;
  font-weight:850;color:var(--green);
}
.op-row{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:7px;margin:12px 0;
}
.op-row button{
  border:1px solid #47627c;border-radius:8px;
  background:#193b59;color:white;padding:13px;font-size:24px;
}
.op-row button.active{background:var(--blue)}
.fractions{
  display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
}
.keypad{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:6px;margin-top:8px;
}
.key{
  border:0;border-radius:8px;background:#213a53;
  color:white;min-height:48px;font-size:23px;font-weight:650;
}
.key.special{background:var(--blue)}
.key.space{font-size:15px}
.key.fraction{
  font-size:15px;min-height:39px;background:#18324d;
}
footer{
  text-align:center;color:#6f91af;font-size:11px;padding:13px;
}
@media(min-width:550px){
  .mode{font-size:13px}
  .app{padding-left:20px;padding-right:20px}
}
</style>
</head>
<body>
<div class="app">

<header>
  <div class="brand"><span>EMT</span> Field Pro</div>
  <div class="version">Auto Calc</div>
</header>

<nav class="tabs">
  <button id="tabFraction" onclick="switchTab('fraction')">
    Fraction Calc
  </button>
  <button id="tabBending" class="active" onclick="switchTab('bending')">
    Conduit Bending
  </button>
</nav>

<section id="bendingPage">
  <div class="modes">
    <button class="mode active" data-mode="offset"
            onclick="setMode('offset')">
      <svg viewBox="0 0 90 40">
        <path d="M5 31H25L62 9H85" fill="none"
              stroke="#cbd6e1" stroke-width="7"
              stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      Offset<br>2 Bends
    </button>

    <button class="mode" data-mode="three"
            onclick="setMode('three')">
      <svg viewBox="0 0 90 40">
        <path d="M5 31H20L45 9L70 31H85" fill="none"
              stroke="#cbd6e1" stroke-width="7"
              stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      3-Point<br>Saddle
    </button>

    <button class="mode" data-mode="four"
            onclick="setMode('four')">
      <svg viewBox="0 0 90 40">
        <path d="M4 31H17L32 10H58L73 31H86" fill="none"
              stroke="#cbd6e1" stroke-width="7"
              stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      4-Point<br>Saddle
    </button>

    <button class="mode" data-mode="kick"
            onclick="setMode('kick')">
      <svg viewBox="0 0 90 40">
        <path d="M5 31H29L85 8" fill="none"
              stroke="#cbd6e1" stroke-width="7"
              stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      Kick
    </button>
  </div>

  <div class="panel">
    <div class="panel-title">
      <span id="bendTitle">Up Offset (2 Bends)</span>
      <small>Side View</small>
    </div>
    <div class="diagram-wrap">
      <svg id="bendDiagram" class="diagram"
           viewBox="0 0 350 190"
           role="img"
           aria-label="Vector conduit bending diagram"></svg>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Inputs</div>
    <div class="section">
      <div class="field">
        <label id="heightLabel">Offset Height (H)</label>
        <input id="height" class="measure"
               value="1 1/4" readonly
               onclick="focusField(this)">
        <span class="unit">in</span>
      </div>

      <div class="field">
        <label id="distanceLabel">Distance from Box Connector</label>
        <input id="distance" class="measure"
               value="4" readonly
               onclick="focusField(this)">
        <span class="unit">in</span>
      </div>

      <div id="widthRow" class="field hidden">
        <label>Obstacle Width</label>
        <input id="widthInput" class="measure"
               value="4" readonly
               onclick="focusField(this)">
        <span class="unit">in</span>
      </div>

      <div class="field">
        <label>Bend Angle</label>
        <div class="choices" id="angles">
          <button class="choice" data-angle="10"
                  onclick="setAngle(10)">10°</button>
          <button class="choice active" data-angle="22.5"
                  onclick="setAngle(22.5)">22.5°</button>
          <button class="choice" data-angle="30"
                  onclick="setAngle(30)">30°</button>
          <button class="choice" data-angle="45"
                  onclick="setAngle(45)">45°</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Calculated Results</div>
    <div class="section" id="results"></div>
  </div>

  <p class="hint">
    Automatic calculations • US tape fractions • Nearest 1/8"
  </p>
</section>

<section id="fractionPage" class="hidden">
  <div class="panel">
    <div class="panel-title">Fraction Calculator</div>
    <div class="section">
      <label>First Measurement</label>
      <div class="calc-display">
        <input id="fractionA" value="3 1/2" readonly
               onclick="focusField(this)">
      </div>

      <div class="op-row">
        <button class="active"
                onclick="setOperation(this,'+')">+</button>
        <button onclick="setOperation(this,'-')">−</button>
        <button onclick="setOperation(this,'*')">×</button>
        <button onclick="setOperation(this,'/')">÷</button>
      </div>

      <label>Second Measurement</label>
      <div class="calc-display">
        <input id="fractionB" value="1 1/4" readonly
               onclick="focusField(this)">
      </div>

      <div class="calc-result" id="fractionResult">4 3/4"</div>
    </div>
  </div>
</section>

<div id="keyboard">
  <div class="fractions">
    <button class="key fraction" onclick="typeKey('1/2')">1/2</button>
    <button class="key fraction" onclick="typeKey('1/4')">1/4</button>
    <button class="key fraction" onclick="typeKey('1/8')">1/8</button>
    <button class="key fraction" onclick="typeKey('3/8')">3/8</button>
    <button class="key fraction" onclick="typeKey('5/8')">5/8</button>
    <button class="key fraction" onclick="typeKey('3/4')">3/4</button>
    <button class="key fraction" onclick="typeKey('7/8')">7/8</button>
  </div>

  <div class="keypad">
    <button class="key" onclick="typeKey('1')">1</button>
    <button class="key" onclick="typeKey('2')">2</button>
    <button class="key" onclick="typeKey('3')">3</button>
    <button class="key" onclick="backspace()">⌫</button>

    <button class="key" onclick="typeKey('4')">4</button>
    <button class="key" onclick="typeKey('5')">5</button>
    <button class="key" onclick="typeKey('6')">6</button>
    <button class="key special" onclick="toggleSign()">+/−</button>

    <button class="key" onclick="typeKey('7')">7</button>
    <button class="key" onclick="typeKey('8')">8</button>
    <button class="key" onclick="typeKey('9')">9</button>
    <button class="key special space"
            onclick="typeKey(' ')">SPACE</button>

    <button class="key" onclick="typeKey('0')">0</button>
    <button class="key" onclick="typeKey('/')">/</button>
    <button class="key" onclick="typeKey('.')">.</button>
    <button class="key" onclick="clearField()">C</button>
  </div>
</div>

<footer>EMT Field Pro • Auto Calculation Edition</footer>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

let currentTab = "bending";
let mode = "offset";
let angle = 22.5;
let manualAngle = false;
let operation = "+";
let activeField = $("height");

function parseMeasure(input) {
  const s = String(input).trim().replace(/"/g, "");
  if (!s) return NaN;

  const mixed = s.match(
    /^([+-])?\s*(\d+(?:\.\d+)?)\s+(\d+)\/(\d+)$/
  );

  if (mixed) {
    const den = Number(mixed[4]);
    if (!den) return NaN;
    return (mixed[1] === "-" ? -1 : 1) *
      (Number(mixed[2]) + Number(mixed[3]) / den);
  }

  const fraction = s.match(
    /^([+-])?\s*(\d+)\/(\d+)$/
  );

  if (fraction) {
    const den = Number(fraction[3]);
    if (!den) return NaN;
    return (fraction[1] === "-" ? -1 : 1) *
      Number(fraction[2]) / den;
  }

  if (/^[+-]?\d+(?:\.\d+)?$/.test(s)) {
    return Number(s);
  }

  return NaN;
}

function gcd(a, b) {
  return b ? gcd(b, a % b) : a;
}

function fmt(value) {
  if (!Number.isFinite(value)) return "—";

  const sign = value < 0 ? "−" : "";
  const eighths = Math.round(Math.abs(value) * 8);
  const whole = Math.floor(eighths / 8);
  const rem = eighths % 8;

  if (!rem) return sign + whole + '"';

  const g = gcd(rem, 8);

  return sign +
    (whole ? whole + " " : "") +
    (rem / g) + "/" + (8 / g) + '"';
}

function focusField(field) {
  activeField = field;

  document.querySelectorAll(".measure,.calc-display")
    .forEach(el => el.classList.remove("selected"));

  if (field.closest(".calc-display")) {
    field.closest(".calc-display").classList.add("selected");
  } else {
    field.classList.add("selected");
  }
}

function refreshCalculations() {
  if (currentTab === "fraction") {
    calculateFraction();
  } else {
    calculate();
  }
}

function typeKey(key) {
  if (!activeField) return;
  activeField.value += key;
  refreshCalculations();
}

function backspace() {
  if (!activeField) return;
  activeField.value = activeField.value.slice(0, -1);
  refreshCalculations();
}

function clearField() {
  if (!activeField) return;
  activeField.value = "";
  refreshCalculations();
}

function toggleSign() {
  if (!activeField) return;

  activeField.value = activeField.value.startsWith("-")
    ? activeField.value.slice(1)
    : "-" + activeField.value;

  refreshCalculations();
}

function switchTab(tab) {
  currentTab = tab;

  $("bendingPage").classList.toggle(
    "hidden", tab !== "bending"
  );
  $("fractionPage").classList.toggle(
    "hidden", tab !== "fraction"
  );

  $("tabBending").classList.toggle(
    "active", tab === "bending"
  );
  $("tabFraction").classList.toggle(
    "active", tab === "fraction"
  );

  focusField(
    tab === "bending" ? $("height") : $("fractionA")
  );

  refreshCalculations();
}

function setOperation(button, value) {
  operation = value;

  document.querySelectorAll(".op-row button")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");
  calculateFraction();
}

function calculateFraction() {
  const a = parseMeasure($("fractionA").value);
  const b = parseMeasure($("fractionB").value);

  if (!Number.isFinite(a) || !Number.isFinite(b)) {
    $("fractionResult").textContent = "—";
    return;
  }

  let result;

  if (operation === "+") result = a + b;
  if (operation === "-") result = a - b;
  if (operation === "*") result = a * b;
  if (operation === "/") result = b === 0 ? NaN : a / b;

  $("fractionResult").textContent =
    Number.isFinite(result)
      ? fmt(result)
      : "Cannot divide by zero";
}

function recommendAngle(h) {
  if (h <= 1.5) return 10;
  if (h <= 3) return 22.5;
  if (h <= 6) return 30;
  return 45;
}

function updateAngleButtons() {
  document.querySelectorAll("#angles .choice")
    .forEach(b => {
      b.classList.toggle(
        "active", Number(b.dataset.angle) === angle
      );
    });
}

function setAngle(value) {
  angle = value;
  manualAngle = true;
  updateAngleButtons();
  calculate();
}

function setMode(value) {
  mode = value;
  manualAngle = false;

  document.querySelectorAll(".mode")
    .forEach(b => b.classList.toggle(
      "active", b.dataset.mode === value
    ));

  const names = {
    offset: "Up Offset (2 Bends)",
    three: "3-Point Saddle",
    four: "4-Point Saddle",
    kick: "Kick (1 Bend)"
  };

  $("bendTitle").textContent = names[value];

  $("heightLabel").textContent =
    value === "offset" ? "Offset Height (H)" :
    value === "kick" ? "Kick Rise (H)" :
    "Obstacle Height (H)";

  $("distanceLabel").textContent =
    value === "offset"
      ? "Distance from Box Connector"
      : "Distance from Reference";

  $("widthRow").classList.toggle(
    "hidden", value !== "four"
  );

  calculate();
}

function line(x1, y1, x2, y2, color="#e5a72e", dash="") {
  return `<line x1="${x1}" y1="${y1}"
    x2="${x2}" y2="${y2}"
    stroke="${color}" stroke-width="1.4"
    ${dash ? 'stroke-dasharray="' + dash + '"' : ""}/>`;
}

function label(x, y, text, color="#e5a72e",
               anchor="middle", fontSize=12) {
  return `<text x="${x}" y="${y}"
    text-anchor="${anchor}"
    font-size="${fontSize}" font-weight="600"
    fill="${color}">${text}</text>`;
}

function arrow(x1, y1, x2, y2) {
  return `<path d="M${x1} ${y1} L${x2} ${y2}"
    fill="none" stroke="#e5a72e"
    stroke-width="1.5"
    marker-start="url(#arr)"
    marker-end="url(#arr)"/>`;
}

function drawDiagram() {
  let svg = `<defs>
    <marker id="arr" markerWidth="6"
      markerHeight="6" refX="3" refY="3"
      orient="auto-start-reverse">
      <path d="M0 0 L6 3 L0 6"
        fill="none" stroke="#e5a72e"/>
    </marker>
  </defs>`;

  if (mode === "offset") {
    svg += `<path d="M12 135 H115 L210 65 H296"
      fill="none" stroke="#1685e5"
      stroke-width="7" stroke-linejoin="round"
      stroke-linecap="round"/>
      <rect x="298" y="40" width="43"
        height="53" rx="3" fill="#7b8b9d"
        stroke="#b7c9d9" stroke-width="2"/>
      <rect x="290" y="54" width="12"
        height="22" fill="#91a1b1"/>
      <path d="M10 147 H287"
        stroke="#9bb2c9" opacity=".55"/>`;

    svg += line(115,135,115,24,"#e5a72e","4 4");
    svg += line(210,65,210,24,"#e5a72e","4 4");
    svg += arrow(117,26,208,26);
    svg += label(162,17,"M2");

    svg += line(210,65,210,110);
    svg += arrow(213,110,290,110);
    svg += label(251,103,"M1");

    svg += line(64,65,64,135,"#ff6565");
    svg += line(58,65,70,65,"#ff6565");
    svg += line(58,135,70,135,"#ff6565");
    svg += label(53,103,"H","#ff6565","end",13);

    svg += `<circle cx="115" cy="135" r="4"
      fill="#ffd039"/>
      <circle cx="210" cy="65" r="4"
      fill="#ffd039"/>`;

    svg += label(124,126,"α","#ffd039");
    svg += label(219,57,"α","#ffd039");
    svg += label(319,34,"BOX","#e5f3ff");
    svg += label(172,174,"Surface","#b6cadd");

  } else if (mode === "three") {
    svg += `<path d="M12 135 H78 L160 53
      L242 135 H338" fill="none"
      stroke="#1685e5" stroke-width="7"
      stroke-linejoin="round"/>`;

    [78,160,242].forEach((x,i) => {
      svg += line(
        x, i === 1 ? 53 : 135,
        x, 22, "#e5a72e", "4 4"
      );
    });

    svg += arrow(80,25,158,25);
    svg += arrow(162,25,240,25);
    svg += label(120,17,"M2");
    svg += label(200,17,"M3");
    svg += label(80,151,"α");
    svg += label(160,45,"2α");
    svg += label(240,151,"α");

  } else if (mode === "four") {
    svg += `<path d="M12 135 H65 L117 65
      H231 L283 135 H338"
      fill="none" stroke="#1685e5"
      stroke-width="7"
      stroke-linejoin="round"/>`;

    [65,117,231,283].forEach((x,i) => {
      svg += line(
        x, (i === 1 || i === 2) ? 65 : 135,
        x, 23, "#e5a72e", "4 4"
      );
    });

    svg += arrow(67,25,115,25);
    svg += arrow(119,25,229,25);
    svg += arrow(233,25,281,25);
    svg += label(91,17,"M2");
    svg += label(174,17,"M3");
    svg += label(257,17,"M4");

  } else {
    // Kick: one bend, two straight sections.
    svg += `<path d="M12 135 H105 L325 35"
      fill="none" stroke="#1685e5"
      stroke-width="7" stroke-linejoin="round"
      stroke-linecap="round"/>
      <circle cx="105" cy="135" r="4"
        fill="#ffd039"/>
      <path d="M145 135 A40 40 0 0 0 141 119"
        stroke="#ffd039" stroke-width="1.5"
        fill="none"/>`;

    svg += label(155,126,"α","#ffd039");
    svg += line(105,135,105,25,"#e5a72e","4 4");
    svg += line(325,35,325,25,"#e5a72e","4 4");
    svg += arrow(107,27,323,27);
    svg += label(215,18,"Kick");
    svg += label(105,157,"Bend","#ffd039");
  }

  $("bendDiagram").innerHTML = svg;
}

function resultRow(name, value, green=false) {
  return `<div class="result-row">
    <span>${name}</span>
    <strong class="${green ? "green" : ""}">
      ${value}
    </strong>
  </div>`;
}

function calculate() {
  const h = parseMeasure($("height").value);
  const d = parseMeasure($("distance").value);
  const w = parseMeasure($("widthInput").value);

  drawDiagram();

  if (
    !Number.isFinite(h) || h <= 0 ||
    !Number.isFinite(d) || d < 0 ||
    (mode === "four" &&
      (!Number.isFinite(w) || w < 0))
  ) {
    $("results").innerHTML = "";
    return;
  }

  if (!manualAngle) {
    angle = recommendAngle(h);
    updateAngleButtons();
  }

  const radians = angle * Math.PI / 180;
  const spacing = h / Math.sin(radians);
  const shrink = h * Math.tan(radians / 2);

  let html = "";

  if (mode === "offset") {
    html += resultRow(
      "Distance Between Bends (M2)",
      fmt(spacing)
    );
    html += resultRow(
      "Shrinkage",
      fmt(shrink),
      true
    );

  } else if (mode === "three") {
    html += resultRow(
      "Center Bend Angle",
      (angle * 2) + "°"
    );
    html += resultRow(
      "Side Spacing",
      fmt(spacing)
    );
    html += resultRow(
      "Outer-to-Outer",
      fmt(2 * spacing)
    );

  } else if (mode === "four") {
    html += resultRow(
      "Ramp Length",
      fmt(spacing)
    );
    html += resultRow(
      "Top Clearance Length",
      fmt(w)
    );
    html += resultRow(
      "Total Shrinkage",
      fmt(2 * shrink),
      true
    );

  } else {
    html += resultRow(
      "Inclined Length",
      fmt(spacing)
    );
    html += resultRow(
      "Horizontal Projection",
      fmt(h / Math.tan(radians))
    );
  }

  $("results").innerHTML = html;
}

switchTab("bending");
calculate();
calculateFraction();
</script>
